<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets the app use the whole screen on notched phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- What people see when the link is shared on WhatsApp, Instagram, etc. -->
    <meta name="description" content="Split bills with friends, flatmates and trips. Free forever, no ads, settle up over UPI." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SplitFree" />
    <meta property="og:title" content="SplitFree: split bills with friends, free forever" />
    <meta property="og:description" content="Track shared expenses, settle up over UPI, and find out who the group's Chindi of the Month is. No ads." />
    <meta property="og:image" content="https://splitwise-clone-but-better.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- These make SplitFree installable with "Add to Home Screen" -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SplitFree" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <style id="expo-reset">
      /* Make the app fill the whole browser window, like a native app */
      html, body { height: 100%; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
  </head>
  <body>
    <noscript>SplitFree needs JavaScript turned on.</noscript>
    <div id="root"></div>
  </body>
</html>
